[project]
name = "gymrat"
version = "0.11.0"
description = "CLI for benchmark-driven optimization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jeffzi" }]
requires-python = ">=3.12"
keywords = ["benchmark", "performance", "optimization", "cli", "profiling"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Benchmark",
]
dependencies = [
  "claude-agent-sdk>=0.2.143,<0.3",
  "pydantic>=2.13,<3",
  "rich>=15.0,<16",
  "scipy>=1.18,<2",
  "typer>=0.27.1,<0.28",
]

[project.urls]
Repository = "https://github.com/jeffzi/gymrat"
Issues = "https://github.com/jeffzi/gymrat/issues"
Changelog = "https://github.com/jeffzi/gymrat/blob/main/CHANGELOG.md"

[project.scripts]
gymrat = "gymrat.cli.app:main"

[dependency-groups]
dev = [
  "diff-cover>=10.5,<11",
  "hypothesis>=6.165,<7",
  "prek>=0.4.14,<0.5",
  "pyrefly>=1.2,<2",
  "pyte>=0.8.2,<0.9",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7.1,<8",
  "pytest-randomly>=4.1,<5",
  "pytest-sugar>=1.1,<2",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.16.4,<0.17",
  "syrupy>=5.5.3,<6",
  "tomli-w>=1.2.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.31"
exclude-newer = "7 days"
preview-features = ["malware-check"]

[tool.uv.audit]
malware-check = true

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]
python-version = "3.12"
search-path = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# Scientific glyphs that appear verbatim in report output strings; not typos.
allowed-confusables = ["×", "α"]
ignore = [
  # --- Docstrings (relaxed for practicality) ---
  "D100", # missing docstring in public module
  "D104", # missing docstring in public package
  "D105", # missing docstring in magic method
  "D107", # missing docstring in __init__ (doc at class level)
  # --- Style preferences ---
  "COM812", # trailing comma (handled by formatter)
  "CPY001", # missing copyright notice (not wanted on every file)
  "G004", # logging f-string (acceptable for modern Python)
  "ISC001", # single-line implicit string concat (conflicts with formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"**/tests/*" = [
  "D101", # missing docstring in public class
  "D102", # missing docstring in public method
  "D103", # missing docstring in public function
  "E402", # module import not at top of file
  "ANN001", # missing type annotation for function argument
  "ANN003", # missing type annotation for **kwargs
  "ANN201", # missing return type for public function
  "ANN202", # missing return type for private function
  "ANN204", # missing return type for special method
  "ANN401", # dynamically typed expression (Any) — mock/fixture returns
  "ARG001", # unused function argument (injected fixtures)
  "ARG002", # unused method argument
  "E501", # line too long (long fixture data)
  "FBT001", # boolean positional arg (parametrize values)
  "INP001", # implicit namespace package (tests have no __init__.py)
  "PERF401", # manual list comprehension (perf irrelevant in tests)
  "PLC0415", # import outside top-level (local test imports)
  "PLR0913", # too many arguments (fixture/builder options mirror TS option objects)
  "PLR2004", # magic value in comparison (assert x == 42)
  "PT012", # pytest.raises block with multiple statements
  "RUF043", # pytest.raises(match) ambiguous pattern
  "S101", # use of assert
  "S105", # hardcoded password string
  "S106", # hardcoded password argument
  "S108", # hardcoded temp file path
  "SIM117", # nested with statements (raises + patch)
  "SLF001", # private member access
  "TRY301", # raise within try
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-n auto --cov --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/gymrat"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.",
]
fail_under = 90
