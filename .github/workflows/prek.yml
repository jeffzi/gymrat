name: prek

on:
  pull_request:
  push:
    branches: [main, fix-ci/**, plan/**, "v[0-9]*"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: prek-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked
      - uses: ./.github/actions/setup-dprint # zizmor: ignore[self-repository] — actionlint rejects $/
      - run: uv run prek run -a --show-diff-on-failure
