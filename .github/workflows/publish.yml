name: Publish

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # The same matrix pull requests run, including the Windows coverage
  # conditional a hand-copied job here used to miss.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        # zizmor: ignore[cache-poisoning] -- setup-node does not cache unless cache: is set
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Check published surface
        run: npm run check:package

      - name: Verify npm version
        run: |
          NPM_VERSION=$(npm --version)
          node -e "
            const [major, minor, patch] = '${NPM_VERSION}'.split('.').map(Number);
            if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) {
              console.error('npm >= 11.5.1 required for --provenance, found ' + '${NPM_VERSION}');
              process.exit(1);
            }
          "

      - name: Publish
        run: npm publish --access public
