version: "3"

vars:
  CLEAN_PATHS:
    - .coverage
    - .coverage.*
    - .hypothesis
    - .pytest_cache
    - .ruff_cache
    - .venv
    - .venv-*
    - coverage.xml
    - dist

tasks:
  default:
    cmds:
      - task --list --sort none
    silent: true

  _require-uv:
    internal: true
    preconditions:
      - sh: command -v uv
        msg: "uv is required — install: https://docs.astral.sh/uv/getting-started/installation/"

  _sync:
    internal: true
    deps: [_require-uv]
    cmds:
      - uv sync --locked

  install:
    desc: Sync the project and dev dependencies from the lockfile
    deps: [_sync]
    cmds:
      - uv run prek install

  test:
    desc: "Run the test suite on the default interpreter (pass extra args after --)"
    deps: [_sync]
    cmds:
      - uv run pytest {{if .CLI_ARGS}}--no-cov {{end}}{{.CLI_ARGS}}

  test:matrix:
    desc: Run the test suite on every supported Python version
    deps: [_require-uv]
    vars:
      PYTHONS: [3.12, 3.13, 3.14]
    cmds:
      - for: { var: PYTHONS }
        cmd: >-
          UV_PROJECT_ENVIRONMENT=.venv-{{.ITEM}}
          uv run --python {{.ITEM}} --locked pytest

  check:
    desc: Run every pre-commit hook across the repo (fixing hooks rewrite files in place)
    deps: [_sync]
    preconditions:
      - sh: command -v dprint
        msg: "dprint is required — install: https://dprint.dev/install/"
    vars:
      GIT_FILES:
        sh: git ls-files --cached --others --exclude-standard
      PREK_FILES: "{{range $f := .GIT_FILES | splitLines}}{{$f | shellQuote}} {{end}}"
    cmds:
      - uv run prek run --files {{.PREK_FILES}}

  schemas:
    desc: Regenerate the JSON Schema, AsyncAPI, and Markdown reference artifacts
    deps: [_sync]
    cmds:
      - uv run python -m gymrat.event_docs

  # Requires Task >= 3.45.3, whose built-in `rm` makes the last command run on
  # Windows as written.
  clean:
    desc: Remove build artifacts, caches, virtualenvs, and leaked lock files
    deps: [_require-uv]
    cmds:
      # Runs in the project environment, before the virtualenvs go. Removes
      # every `__pycache__` under src/ and tests/ with any directory that leaves
      # empty, and the lock files gymrat and its tests leave in the system temp
      # directory. A lock is removed only while this script holds it, so the
      # files of a lock a running gymrat command holds stay in place; one file
      # that cannot be removed is reported and the rest are still cleaned.
      - |
        uv run python - <<'PY'
        import os
        import shutil
        import sys
        import tempfile
        from pathlib import Path

        from filelock import FileLock, Timeout

        from gymrat.session.lock import os_lock_file, publish_lock_file

        for tree in (Path("src"), Path("tests")):
            for cache in list(tree.rglob("__pycache__")):
                shutil.rmtree(cache, ignore_errors=True)
                # Only the directories above a removed cache are candidates: one
                # that was empty beforehand is somebody's and stays.
                for parent in cache.parents:
                    if parent == tree or any(parent.iterdir()):
                        break
                    parent.rmdir()
        holders = {
            # The OS and publish lock files extend the holder's ``.json`` name.
            str(leftover).partition(".json")[0] + ".json"
            for pattern in ("gymrat-lock-*", "gymrat-supervise-lock-*")
            for leftover in Path(tempfile.gettempdir()).glob(pattern)
        }

        def unlink_each(paths):
            for path in paths:
                try:
                    Path(path).unlink(missing_ok=True)
                except OSError as error:
                    print(f"warning: could not remove {path}: {error}", file=sys.stderr)

        # Windows refuses to delete a file while any handle, this one's included,
        # holds it open without delete sharing: there the lock files go after the
        # release, and one a rival opened in between stays with it.
        DELETE_WHILE_OPEN = os.name != "nt"
        for holder in sorted(holders):
            # The publish lock comes first, as in ``acquire_lock``: a command that
            # holds it has not yet taken the main lock or written its holder record.
            locks = [
                FileLock(path, timeout=0, preserve_lock_file=True)
                for path in (publish_lock_file(holder), os_lock_file(holder))
            ]
            lock_files = [lock.lock_file for lock in locks]
            try:
                try:
                    for lock in locks:
                        lock.acquire()
                except Timeout:
                    continue
                except OSError as error:
                    print(f"warning: skipped {holder}: {error}", file=sys.stderr)
                    continue
                unlink_each([holder, *(lock_files if DELETE_WHILE_OPEN else [])])
            finally:
                for lock in reversed(locks):
                    if lock.is_locked:
                        lock.release()
            if not DELETE_WHILE_OPEN:
                unlink_each(lock_files)
        PY
      - rm -rf {{.CLEAN_PATHS | join " "}}
